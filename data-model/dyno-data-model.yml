domain_note: >-
  The domain is protein engineering, not a business object graph: Dataset holds
  structures, Job runs a named open model over them, Artifact/Asset holds the
  outputs, and Protocol is the shareable recipe. Scoring metrics that travel with
  results (plddt, ptm, af2_iptm, af2_ipae, rmsd) are documented in
  cli/dyno-cli.yml rather than typed in the spec — scores are delivered as a CSV
  behind a signed URL, not as a JSON schema.
gaps_to_report_upstream:
- Scores are returned only as a signed-URL CSV; there is no typed score object in
  the OpenAPI, so an agent cannot read results without parsing an untyped file.
- No id prefixes and no $ref links between resources; every relationship is an
  untyped string field.
