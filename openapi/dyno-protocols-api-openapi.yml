components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CreateProtocolRequest:
      properties:
        name:
          type: string
          title: Name
          description: Protocol name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Protocol description
        intent_signature:
          additionalProperties: true
          type: object
          title: Intent Signature
          description: Structured intent
        protocol_template:
          additionalProperties: true
          type: object
          title: Protocol Template
          description: Parameterized workflow template
        source_workflow_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Workflow Id
          description: Source workflow ID
        visibility:
          type: string
          title: Visibility
          description: Visibility level
          default: private
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Tags for search
      type: object
      required:
      - name
      - intent_signature
      - protocol_template
      title: CreateProtocolRequest
      description: Request to create protocol.
    UpdateProtocolRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Protocol name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Protocol description
        intent_signature:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Intent Signature
          description: Structured intent
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Tags for search
      type: object
      title: UpdateProtocolRequest
      description: Request to update protocol.
    RecommendProtocolRequest:
      properties:
        user_prompt:
          type: string
          title: User Prompt
          description: User's workflow request
        force_refresh:
          type: boolean
          title: Force Refresh
          description: If true, bypass intent cache and re-extract (for 'Regenerate recommendations' button)
          default: false
        filters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Filters
          description: Optional filters (target_type, allowed_tools)
      type: object
      required:
      - user_prompt
      title: RecommendProtocolRequest
      description: Request for protocol recommendations.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ProtocolResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        intent_signature:
          additionalProperties: true
          type: object
          title: Intent Signature
        protocol_template:
          additionalProperties: true
          type: object
          title: Protocol Template
        source_workflow_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Workflow Id
        parent_protocol_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Protocol Id
        version:
          type: integer
          title: Version
        visibility:
          type: string
          title: Visibility
        tags:
          items:
            type: string
          type: array
          title: Tags
        is_starred:
          type: boolean
          title: Is Starred
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - id
      - name
      - description
      - intent_signature
      - protocol_template
      - source_workflow_id
      - parent_protocol_id
      - version
      - visibility
      - tags
      - is_starred
      - created_at
      - updated_at
      title: ProtocolResponse
      description: Protocol response model.
    ValidateProtocolRequest:
      properties:
        protocol_template:
          additionalProperties: true
          type: object
          title: Protocol Template
          description: Parameterized workflow template to validate
        dry_run:
          type: boolean
          title: Dry Run
          description: If true, instantiate with synthetic params and run workflow/preflight validation
          default: true
      type: object
      required:
      - protocol_template
      title: ValidateProtocolRequest
      description: Request to validate a protocol template without persisting.
    ForkProtocolRequest:
      properties:
        new_name:
          anyOf:
          - type: string
          - type: 'null'
          title: New Name
          description: Name for forked protocol
      type: object
      title: ForkProtocolRequest
      description: Request to fork protocol.
