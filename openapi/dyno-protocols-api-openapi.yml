          title: X-Organization-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Unstar Protocol V1 Phi Protocols  Protocol Id  Star Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
