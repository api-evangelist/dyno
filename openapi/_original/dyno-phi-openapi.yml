    get:
      summary: Get Artifact Download Url
      description: "Generate a signed HTTPS download URL for an artifact.\n\nThe signed URL allows the caller to download\
        \ the file directly from GCS\nwithout any GCP credentials.  The URL expires after `expires_in` seconds\n(default 1\
        \ hour).\n\nAuthentication is required: provide a valid x-api-key header (Clerk API key\nor the static API_SECRET_KEY\
        \ for local dev).\n\nArgs:\n    artifact_id: Artifact ID\n    expires_in: URL expiry time in seconds (default: 3600\
        \ = 1 hour)\n\nReturns:\n    DownloadURLResponse with signed HTTPS download URL"
      operationId: get_artifact_download_url_artifacts__artifact_id__download_get
      parameters:
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          title: Artifact Id
      - name: expires_in
        in: query
        required: false
        schema:
          type: integer
          default: 3600
          title: Expires In
      - name: x-api-key
