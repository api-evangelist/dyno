components:
  schemas:
    AgentConfig:
      properties:
        name:
          type: string
          title: Name
          description: Agent name (e.g., 'proteinmpnn-designer')
        instructions:
          type: string
          title: Instructions
          description: System prompt/instructions for the agent. Should be general-purpose, not prescriptive.
        model:
          type: string
          title: Model
          description: LLM model to use
          default: gpt-4o
        temperature:
          type: number
          title: Temperature
          description: Temperature for LLM responses
          default: 0.1
        tool_choice:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Choice
          description: 'Tool choice strategy: ''auto'', ''required'', ''none'', or None for default behavior'
        tools:
          items: {}
          type: array
          title: Tools
          description: List of FunctionTools this agent can use
      type: object
      required:
      - name
      - instructions
      title: AgentConfig
      description: Configuration for an AI agent.
    AppendNotesRequest:
      properties:
        content:
          type: string
          title: Content
          description: Markdown content to append to the dataset's research notes
      type: object
      required:
      - content
      title: AppendNotesRequest
    ArtifactListResponse:
      properties:
        run_id:
          type: string
          title: Run Id
        artifacts:
          items:
            $ref: '#/components/schemas/ArtifactResponse'
          type: array
          title: Artifacts
        total_count:
          type: integer
          title: Total Count
        total_size_bytes:
          type: integer
          title: Total Size Bytes
      type: object
      required:
      - run_id
      - artifacts
      - total_count
      - total_size_bytes
      title: ArtifactListResponse
      description: Response model for list of artifacts.
    ArtifactResponse:
      properties:
        artifact_id:
          type: string
          title: Artifact Id
        run_id:
          type: string
          title: Run Id
        artifact_type:
          type: string
          title: Artifact Type
        filename:
          type: string
          title: Filename
        storage_path:
          type: string
          title: Storage Path
        size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size Bytes
        mime_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime Type
        created_at:
          type: string
          format: date-time
