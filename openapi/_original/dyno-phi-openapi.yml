  /v1/phi/jobs/batch:
    post:
      tags:
      - jobs
      summary: Submit Batch Jobs
      description: "Submit multiple biomodal jobs in a batch.\n\nThis endpoint allows submitting multiple jobs at once, with\
        \ partial failure handling.\nEach job is submitted independently, and failures don't prevent other jobs from being\
        \ submitted.\n\nArgs:\n    requests: List of job submission requests\n    org_id: Organization ID from header\n  \
        \  user_id: User ID from header\n    db: Database session\n\nReturns:\n    BatchJobSubmitResponse with batch_id and\
        \ per-job results\n\nExample:\n    ```json\n    {\n      \"requests\": [\n        {\n          \"job_type\": \"esmfold\"\
        ,\n          \"params\": {\"fasta_str\": \">seq1\\nMKVLWAAS\"}\n        },\n        {\n          \"job_type\": \"\
        alphafold\",\n          \"params\": {\"fasta_str\": \">seq2\\nGKVFWAAS\"}\n        }\n      ]\n    }\n    ```"
      operationId: submit_batch_jobs_v1_phi_jobs_batch_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: API key for authentication
          title: X-Api-Key
        description: API key for authentication
      - name: X-User-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      - name: X-Organization-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Organization-Id
      requestBody:
        required: true
