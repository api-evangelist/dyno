name: Dyno
description: >-
  Dyno Therapeutics is an AI and biotechnology company building high-performance
  gene delivery technologies to unlock the potential of next-generation genetic
  medicine. Using its CapsidMap platform, which combines machine learning with
  high-throughput in vivo measurement, Dyno designs novel adeno-associated virus
  (AAV) capsids with improved tissue targeting, immune evasion, manufacturability,
  and payload capacity. Alongside its capsid partnerships, Dyno operates a public
  developer platform — Dyno Psi-Phi at design.dynotx.com — that exposes a REST
  API for agentic protein design: submit structure-prediction, inverse-folding
  and binder-scoring jobs against GPU-backed open models (AlphaFold2, ESMFold,
  ProteinMPNN, Boltz, ESM-2, RFDiffusion3, BoltzGen, OpenFold3), track job status,
  and retrieve scored results. The platform ships a first-party Python CLI
  (dyno-phi), an MIT-licensed open-source repository, and a provider-published
  Claude Code Agent Skill. Founded on research from George Church's lab at
  Harvard, Dyno is headquartered in Watertown, Massachusetts, and is an a16z
  Bio+Health portfolio company.
