apis:
- name: Dyno Phi — Protein Design API
  description: >-
    Phi is a biomodal computation platform for protein design. The REST API lets
    a caller create datasets from PDB/CIF structures, submit structure-prediction
    and sequence-design jobs across twenty biomodal job types (ESMFold,
    AlphaFold2 multimer, ProteinMPNN, Boltz, Chai-1, ESM-2, RFDiffusion3,
    BoltzGen, OpenFold3, BindCraft, AF2Rank, TM-score and more), compose and
    execute multi-step workflows and protocols, register agents and tools, poll
    job status, stream job logs, and download scored results and artifacts.
    Authentication is a static API key; per-user and per-organization job quotas
    are exposed through the API itself.
  humanURL: https://design.dynotx.com/docs
  baseURL: https://api.dyno-agents.app
