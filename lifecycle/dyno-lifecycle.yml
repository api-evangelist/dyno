  legal_contact: legal@dynotx.com
  note: >-
    engineering@dynotx.com is published in the repo's Claude Code marketplace
    manifest; legal@dynotx.com on the open-source notice page. Neither is
    presented as a support channel on the platform itself.
gaps_to_report_upstream:
- No status page and no published SLA for a GPU-backed compute API where jobs run
  for minutes to hours.
- No deprecation policy and no Sunset/Deprecation header support; the one real
  withdrawal (design/boltzgen commands) was announced only in a CLI changelog.
- No API-level changelog — a consumer cannot see when the REST contract changes.
