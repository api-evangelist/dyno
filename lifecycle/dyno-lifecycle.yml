description: >-
  Lifecycle posture for the Dyno Phi Protein Design API. The API is versioned in
  the URI path and the first-party CLI keeps a Keep-a-Changelog file, but the
  provider publishes no status page, no deprecation policy, no SLA and no
  Sunset/Deprecation header support. No StatusPage or Deprecation pointer is
  wired in apis.yml, because neither exists.
versioning:
  scheme: uri-path
  current: v1
  prefix: /v1/phi
  info_version: 1.0.0
  policy_url: null
  policy_published: false
  note: >-
    The API is young — the platform launched publicly at NVIDIA GTC in March
    2026 and the ASGCT announcement in May 2026 — and has not yet shipped a
    second version.
unversioned_surface:
  present: true
  paths:
  - GET /health
  - POST /runs
  - GET /runs/{run_id}
  - DELETE /runs/{run_id}
  - GET /runs/{run_id}/result
  - GET /runs/{run_id}/artifacts
  - GET /artifacts/{artifact_id}
  - GET /artifacts/{artifact_id}/download
  note: >-
    Eight operations sit outside the /v1/phi prefix and carry no tags. At least
    one is duplicated inside the prefix
    (/v1/phi/artifacts/{artifact_id}/download), which suggests an in-progress
    migration of the older run/artifact surface under the versioned namespace.
    Which of the pair is canonical is not stated.
